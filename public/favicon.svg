<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5ee69c"/>
      <stop offset="1" stop-color="#048f6a"/>
    </linearGradient>
    <linearGradient id="beak" x1="0.6" y1="0.3" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffb33d"/>
      <stop offset="1" stop-color="#f57c1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#123a34" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0f1013" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="20.5" fill="#0f1013"/>
  <rect width="100" height="100" rx="20.5" fill="url(#glow)"/>

  <!-- tail -->
  <g fill="#0b634f">
    <polygon points="36,58 52,60 30,90"/>
    <polygon points="36,58 52,60 46,92"/>
  </g>

  <!-- body -->
  <ellipse cx="48.5" cy="61.5" rx="17.5" ry="22.5" fill="url(#body)" transform="rotate(-7 48.5 61.5)"/>
  <!-- wing -->
  <ellipse cx="45.5" cy="65.5" rx="9.5" ry="14.5" fill="#056f55" transform="rotate(-10 45.5 65.5)"/>
  <!-- head -->
  <circle cx="57.5" cy="39.5" r="14.5" fill="url(#body)"/>

  <!-- beak -->
  <polygon points="66.5,34.5 85.5,45.5 64.5,50.5" fill="url(#beak)"/>
  <polygon points="78.5,43 85.5,45.5 77.5,53" fill="#f57c1f"/>

  <!-- eye -->
  <circle cx="62.5" cy="36.5" r="3" fill="#070a0b"/>
  <circle cx="63.2" cy="35.6" r="1.1" fill="#e9fff9"/>
</svg>
